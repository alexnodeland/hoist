# The Hoist console in a container, over the ~/.hoist on this machine.
#
#   HOIST_UID=$(id -u) HOIST_GID=$(id -g) docker compose up -d
#   docker compose logs console     # the URL to open, with its token
#
# It pulls ghcr.io/alexnodeland/hoist-console; `docker compose up --build`
# builds it from this checkout instead. docs/console.md has the rest.
services:
  console:
    image: ghcr.io/alexnodeland/hoist-console:latest
    build:
      context: .
      target: console
    # This machine only. The console also asks for its token.
    ports:
      - "127.0.0.1:8080:8080"
    # The data Hoist writes, read and written in place: sessions, flows,
    # the server registry and the console's jobs. HOIST_HOME, when set,
    # is where it is instead of ~/.hoist.
    volumes:
      - ${HOIST_HOME:-${HOME}/.hoist}:/data/.hoist
    # Your user and group, so the files the console writes are yours. Leave
    # them unset on macOS and Windows, where Docker Desktop maps ownership.
    user: "${HOIST_UID:-10001}:${HOIST_GID:-10001}"
    environment:
      # A token of your own keeps the console's URL the same across restarts;
      # without one, it makes one at each start and prints it in the logs.
      - HOIST_CONSOLE_TOKEN
      # For jobs that ask Jev (learning with an arbiter): passed through from
      # your environment when set, never written here.
      - TYPESAFE_API_KEY
    restart: unless-stopped
