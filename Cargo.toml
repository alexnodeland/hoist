[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/alexnodeland/hoist"
authors = ["Alex Nodeland"]
homepage = "https://hoist.alexnodeland.com/"
readme = "README.md"
keywords = ["mcp", "llm", "agents", "bayesian", "speculation"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
fugue = { package = "fugue-ppl", git = "https://github.com/alexnodeland/fugue", rev = "3d65f3db3ce489d61125c217041a6cf980492f08", features = ["program"] }
fugue-evo = { version = "0.3.1", default-features = false, features = ["std", "classic"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hoist-model = { path = "crates/hoist-model" }
hoist-oracle = { path = "crates/hoist-oracle" }
hoist-report = { path = "crates/hoist-report" }
hoist-trace = { path = "crates/hoist-trace" }
ts-rs = "12"
