<svg xmlns="http://www.w3.org/2000/svg" width="880" height="284" viewBox="0 0 880 284" role="img" aria-labelledby="t d"><title id="t">How Hoist works: record, learn, review, serve</title><desc id="d">Record sessions behind hoist-mcp. Learn a flow with hoist learn. Review it with hoist flow-show, in shadow, then promote the lookups that paid. Serve it: after each call, the flow's lookups ride in the same tool result.</desc><style>
:root{--bg:#f8fbfb;--surface:#ffffff;--well:#eff3f4;--line:#dae1e3;--strong:#7e888b;--text:#141c1e;--muted:#4a5557;--subtle:#646e70;--accent:#02767b;--gfx:#039298;--soft:#e0f5f6;--ink:#141c1e;--onink:#f8fbfb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f11;--surface:#121719;--well:#191f21;--line:#272f32;--strong:#606b6f;--text:#eceff0;--muted:#b3bcbf;--subtle:#909a9d;--accent:#5dd2d8;--gfx:#33c0c7;--soft:#0b292c;--ink:#eceff0;--onink:#0b0f11}}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--surface);stroke:var(--line)}.well{fill:var(--well)}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--accent)}.gfx{fill:var(--gfx)}.soft{fill:var(--soft)}
.turn{fill:var(--surface);stroke:var(--text);stroke-width:1.5}.chip{fill:var(--well);stroke:var(--strong);stroke-width:1.2}
.read{fill:var(--gfx)}.onread{fill:var(--onink)}.ghost{fill:none;stroke:var(--strong);stroke-width:1.5;stroke-dasharray:5 4}
.ink{fill:var(--ink)}.onink{fill:var(--onink)}.ln{stroke:var(--line);stroke-width:1}.lnS{stroke:var(--strong);stroke-width:1.5;fill:none}
.lnA{stroke:var(--gfx);stroke-width:2;fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes pk{0%{transform:translateX(0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(642.0px);opacity:0}}.pk{animation:pk 5.5s ease-in-out infinite}</style><rect class="bg" x=".5" y=".5" width="879" height="283" rx="14"/><line class="lnS" x1="119.0" x2="761.0" y1="92" y2="92" stroke-dasharray="2 5"/><g class="pk"><circle cx="119.0" cy="92" r="6" class="read"/></g><rect class="card" x="24" y="56" width="190" height="202" rx="10"/><circle cx="119.0" cy="92" r="22" class="soft" stroke="var(--gfx)" stroke-width="1.5"/><g transform="translate(107.0,80)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6" fill="var(--gfx)" stroke="none"/><circle cx="12" cy="12" r="10"/></g><text x="40" y="138" font-size="11" font-weight="700" class="acc m">STEP 1</text><text x="40" y="160" font-size="18" font-weight="700">Record</text><rect class="well" x="40" y="170" width="158" height="22" rx="5"/><text class="m" x="48" y="185" font-size="11.5">hoist-mcp</text><text x="40" y="210" font-size="11.5" class="muted">Run your MCP server behind</text><text x="40" y="224" font-size="11.5" class="muted">the proxy. It forwards</text><text x="40" y="238" font-size="11.5" class="muted">every message and logs each</text><text x="40" y="252" font-size="11.5" class="muted">session.</text><rect class="card" x="238" y="56" width="190" height="202" rx="10"/><circle cx="333.0" cy="92" r="22" class="soft" stroke="var(--gfx)" stroke-width="1.5"/><g transform="translate(321.0,80)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13M10 20V6M16 20V10M22 20H2"/></g><text x="254" y="138" font-size="11" font-weight="700" class="acc m">STEP 2</text><text x="254" y="160" font-size="18" font-weight="700">Learn</text><rect class="well" x="254" y="170" width="158" height="22" rx="5"/><text class="m" x="262" y="185" font-size="11.5">hoist learn</text><text x="254" y="210" font-size="11.5" class="muted">Count which reads follow</text><text x="254" y="224" font-size="11.5" class="muted">which calls, and where each</text><text x="254" y="238" font-size="11.5" class="muted">argument came from. Out</text><text x="254" y="252" font-size="11.5" class="muted">comes a flow.</text><rect class="card" x="452" y="56" width="190" height="202" rx="10"/><circle cx="547.0" cy="92" r="22" class="soft" stroke="var(--gfx)" stroke-width="1.5"/><g transform="translate(535.0,80)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><text x="468" y="138" font-size="11" font-weight="700" class="acc m">STEP 3</text><text x="468" y="160" font-size="18" font-weight="700">Review</text><rect class="well" x="468" y="170" width="158" height="22" rx="5"/><text class="m" x="476" y="185" font-size="11.5">hoist flow-show</text><text x="468" y="210" font-size="11.5" class="muted">Read the flow, run it in</text><text x="468" y="224" font-size="11.5" class="muted">shadow, then promote the</text><text x="468" y="238" font-size="11.5" class="muted">lookups that paid.</text><rect class="card" x="666" y="56" width="190" height="202" rx="10"/><circle cx="761.0" cy="92" r="22" class="soft" stroke="var(--gfx)" stroke-width="1.5"/><g transform="translate(749.0,80)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h14M12 6l6 6-6 6"/><path d="M21 6v12"/></g><text x="682" y="138" font-size="11" font-weight="700" class="acc m">STEP 4</text><text x="682" y="160" font-size="18" font-weight="700">Serve</text><rect class="well" x="682" y="170" width="158" height="22" rx="5"/><text class="m" x="690" y="185" font-size="11.5">hoist-mcp --flow</text><text x="682" y="210" font-size="11.5" class="muted">After each call, the flow’s</text><text x="682" y="224" font-size="11.5" class="muted">lookups ride in the same</text><text x="682" y="238" font-size="11.5" class="muted">tool result.</text><text x="24" y="30" font-size="13" font-weight="700" class="muted">THE LOOP</text><text x="856" y="30" text-anchor="end" font-size="11.5" class="subtle">sessions keep arriving: hoist stage learns the next version beside the served one; hoist flow-commit serves it</text></svg>
