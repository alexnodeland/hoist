<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160" role="img" aria-labelledby="t d"><title id="t">What Hoist is</title><desc id="d">Any agent, any MCP server. Reads only. No model of its own. Reviewable: a flow is a JSON file.</desc><style>
:root{--bg:#f8fbfb;--surface:#ffffff;--well:#eff3f4;--line:#dae1e3;--strong:#7e888b;--text:#141c1e;--muted:#4a5557;--subtle:#646e70;--accent:#02767b;--gfx:#039298;--soft:#e0f5f6;--ink:#141c1e;--onink:#f8fbfb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f11;--surface:#121719;--well:#191f21;--line:#272f32;--strong:#606b6f;--text:#eceff0;--muted:#b3bcbf;--subtle:#909a9d;--accent:#5dd2d8;--gfx:#33c0c7;--soft:#0b292c;--ink:#eceff0;--onink:#0b0f11}}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--surface);stroke:var(--line)}.well{fill:var(--well)}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--accent)}.gfx{fill:var(--gfx)}.soft{fill:var(--soft)}
.turn{fill:var(--surface);stroke:var(--text);stroke-width:1.5}.chip{fill:var(--well);stroke:var(--strong);stroke-width:1.2}
.read{fill:var(--gfx)}.onread{fill:var(--onink)}.ghost{fill:none;stroke:var(--strong);stroke-width:1.5;stroke-dasharray:5 4}
.ink{fill:var(--ink)}.onink{fill:var(--onink)}.ln{stroke:var(--line);stroke-width:1}.lnS{stroke:var(--strong);stroke-width:1.5;fill:none}
.lnA{stroke:var(--gfx);stroke-width:2;fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes p0{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}.p0{animation:p0 .7s ease-out 0.00s backwards}@keyframes p1{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}.p1{animation:p1 .7s ease-out 0.12s backwards}@keyframes p2{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}.p2{animation:p2 .7s ease-out 0.24s backwards}@keyframes p3{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}.p3{animation:p3 .7s ease-out 0.36s backwards}</style><rect fill="none" stroke="none" x=".5" y=".5" width="879" height="159" rx="14"/><g class="p0"><rect class="card" x="24" y="14" width="196" height="132" rx="10"/><g transform="translate(40,28)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/></g><text x="40" y="74" font-size="14" font-weight="700">Any agent, any server</text><text x="40" y="92" font-size="11.5" class="muted">Wraps a command or an HTTP</text><text x="40" y="106" font-size="11.5" class="muted">server. Nothing else</text><text x="40" y="120" font-size="11.5" class="muted">changes.</text></g><g class="p1"><rect class="card" x="236" y="14" width="196" height="132" rx="10"/><g transform="translate(252,28)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><text x="252" y="74" font-size="14" font-weight="700">Reads only</text><text x="252" y="92" font-size="11.5" class="muted">Its worst case is a</text><text x="252" y="106" font-size="11.5" class="muted">detour: a lookup nobody</text><text x="252" y="120" font-size="11.5" class="muted">used. No state changes.</text></g><g class="p2"><rect class="card" x="448" y="14" width="196" height="132" rx="10"/><g transform="translate(464,28)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13M10 20V6M16 20V10M22 20H2"/></g><text x="464" y="74" font-size="14" font-weight="700">No model of its own</text><text x="464" y="92" font-size="11.5" class="muted">The reach decider counts.</text><text x="464" y="106" font-size="11.5" class="muted">No key; a decision takes</text><text x="464" y="120" font-size="11.5" class="muted">under a millisecond.</text></g><g class="p3"><rect class="card" x="660" y="14" width="196" height="132" rx="10"/><g transform="translate(676,28)" class="lnA" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></g><text x="676" y="74" font-size="14" font-weight="700">Reviewable</text><text x="676" y="92" font-size="11.5" class="muted">A flow is a JSON file of</text><text x="676" y="106" font-size="11.5" class="muted">counts. Diff it, shadow</text><text x="676" y="120" font-size="11.5" class="muted">it, promote it.</text></g></svg>
