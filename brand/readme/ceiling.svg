<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img" aria-labelledby="t d"><title id="t">The read-only ceiling by benchmark</title><desc id="d">The most LLM turns a read-only speculator could save, as a share of turns: AgentDojo travel suite 47.1%, τ²-bench 29.0%, τ-bench 28.4%, AgentDojo four suites 22.1%, BFCL multi-turn 13.2%, DTap-Bench 10.7%, MCPMark 7.0%, WorkBench 3.5%.</desc><style>
:root{--bg:#f8fbfb;--surface:#ffffff;--well:#eff3f4;--line:#dae1e3;--strong:#7e888b;--text:#141c1e;--muted:#4a5557;--subtle:#646e70;--accent:#02767b;--gfx:#039298;--soft:#e0f5f6;--ink:#141c1e;--onink:#f8fbfb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f11;--surface:#121719;--well:#191f21;--line:#272f32;--strong:#606b6f;--text:#eceff0;--muted:#b3bcbf;--subtle:#909a9d;--accent:#5dd2d8;--gfx:#33c0c7;--soft:#0b292c;--ink:#eceff0;--onink:#0b0f11}}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--surface);stroke:var(--line)}.well{fill:var(--well)}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--accent)}.gfx{fill:var(--gfx)}.soft{fill:var(--soft)}
.turn{fill:var(--surface);stroke:var(--text);stroke-width:1.5}.chip{fill:var(--well);stroke:var(--strong);stroke-width:1.2}
.read{fill:var(--gfx)}.onread{fill:var(--onink)}.ghost{fill:none;stroke:var(--strong);stroke-width:1.5;stroke-dasharray:5 4}
.ink{fill:var(--ink)}.onink{fill:var(--onink)}.ln{stroke:var(--line);stroke-width:1}.lnS{stroke:var(--strong);stroke-width:1.5;fill:none}
.lnA{stroke:var(--gfx);stroke-width:2;fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes c0{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c0{transform-box:fill-box;transform-origin:left;animation:c0 .9s cubic-bezier(.2,.7,.2,1) 0.00s backwards}@keyframes c1{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c1{transform-box:fill-box;transform-origin:left;animation:c1 .9s cubic-bezier(.2,.7,.2,1) 0.08s backwards}@keyframes c2{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c2{transform-box:fill-box;transform-origin:left;animation:c2 .9s cubic-bezier(.2,.7,.2,1) 0.16s backwards}@keyframes c3{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c3{transform-box:fill-box;transform-origin:left;animation:c3 .9s cubic-bezier(.2,.7,.2,1) 0.24s backwards}@keyframes c4{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c4{transform-box:fill-box;transform-origin:left;animation:c4 .9s cubic-bezier(.2,.7,.2,1) 0.32s backwards}@keyframes c5{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c5{transform-box:fill-box;transform-origin:left;animation:c5 .9s cubic-bezier(.2,.7,.2,1) 0.40s backwards}@keyframes c6{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c6{transform-box:fill-box;transform-origin:left;animation:c6 .9s cubic-bezier(.2,.7,.2,1) 0.48s backwards}@keyframes c7{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.c7{transform-box:fill-box;transform-origin:left;animation:c7 .9s cubic-bezier(.2,.7,.2,1) 0.56s backwards}</style><rect class="bg" x=".5" y=".5" width="879" height="383" rx="14"/><text x="24" y="30" font-size="13" font-weight="700" class="muted">WHERE A READ-ONLY SPECULATOR HAS ROOM</text><text x="24" y="50" font-size="12" class="subtle">The read-only ceiling: the most LLM turns a speculator that binds arguments from tool results could save. The domain sets it.</text><text x="24" y="95" font-size="12.5" >AgentDojo, travel suite</text><rect class="well" x="190" y="83" width="330" height="16" rx="4"/><rect class="read c0" x="190" y="83" width="282.6" height="16" rx="4"/><text class="m" x="480.6" y="96" font-size="12" font-weight="700">47.1%</text><text x="538" y="95" font-size="11" class="subtle">a city’s listing names every later lookup</text><text x="24" y="125" font-size="12.5" font-weight="700">τ²-bench</text><rect class="well" x="190" y="113" width="330" height="16" rx="4"/><rect class="read c1" x="190" y="113" width="174.0" height="16" rx="4"/><text class="m" x="372.0" y="126" font-size="12" font-weight="700">29.0%</text><text x="538" y="125" font-size="11" class="subtle">the user names themselves; the agent walks the records</text><text x="24" y="155" font-size="12.5" >τ-bench</text><rect class="well" x="190" y="143" width="330" height="16" rx="4"/><rect class="read c2" x="190" y="143" width="170.4" height="16" rx="4"/><text class="m" x="368.4" y="156" font-size="12" font-weight="700">28.4%</text><text x="538" y="155" font-size="11" class="subtle">the same walk, with agents a year older</text><text x="24" y="185" font-size="12.5" >AgentDojo, 4 suites</text><rect class="well" x="190" y="173" width="330" height="16" rx="4"/><rect class="read c3" x="190" y="173" width="132.6" height="16" rx="4"/><text class="m" x="330.6" y="186" font-size="12" font-weight="700">22.1%</text><text x="24" y="215" font-size="12.5" >BFCL multi-turn</text><rect class="well" x="190" y="203" width="330" height="16" rx="4"/><rect class="ink c4" x="190" y="203" width="79.2" height="16" rx="4"/><text class="m" x="277.2" y="216" font-size="12" font-weight="700">13.2%</text><text x="24" y="245" font-size="12.5" >DTap-Bench, 6 domains</text><rect class="well" x="190" y="233" width="330" height="16" rx="4"/><rect class="ink c5" x="190" y="233" width="64.2" height="16" rx="4"/><text class="m" x="262.2" y="246" font-size="12" font-weight="700">10.7%</text><text x="24" y="275" font-size="12.5" >MCPMark</text><rect class="well" x="190" y="263" width="330" height="16" rx="4"/><rect class="ink c6" x="190" y="263" width="42.0" height="16" rx="4"/><text class="m" x="240.0" y="276" font-size="12" font-weight="700">7.0%</text><text x="538" y="275" font-size="11" class="subtle">agents write their own SQL and pick the files</text><text x="24" y="305" font-size="12.5" >WorkBench</text><rect class="well" x="190" y="293" width="330" height="16" rx="4"/><rect class="ink c7" x="190" y="293" width="21.0" height="16" rx="4"/><text class="m" x="219.0" y="306" font-size="12" font-weight="700">3.5%</text><text x="538" y="305" font-size="11" class="subtle">each request names what to read</text><text x="24" y="354" font-size="11" class="subtle">Share of LLM turns, replayed from the agents’ published trajectories (the paper’s Tables 1 and 1b).</text><text x="24" y="368" font-size="11" class="subtle">In WorkBench, the lowest, the speculator makes no lookup at all.</text></svg>
