<svg xmlns="http://www.w3.org/2000/svg" width="880" height="258" viewBox="0 0 880 258" role="img" aria-labelledby="t d"><title id="t">A lookup spares an LLM turn</title><desc id="d">Without Hoist the agent reads the user, then the order, then replies, in three LLM turns. With Hoist the order is read ahead and returned in the same tool result, and the agent replies in its second turn.</desc><style>
:root{--bg:#f8fbfb;--surface:#ffffff;--well:#eff3f4;--line:#dae1e3;--strong:#7e888b;--text:#141c1e;--muted:#4a5557;--subtle:#646e70;--accent:#02767b;--gfx:#039298;--soft:#e0f5f6;--ink:#141c1e;--onink:#f8fbfb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f11;--surface:#121719;--well:#191f21;--line:#272f32;--strong:#606b6f;--text:#eceff0;--muted:#b3bcbf;--subtle:#909a9d;--accent:#5dd2d8;--gfx:#33c0c7;--soft:#0b292c;--ink:#eceff0;--onink:#0b0f11}}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--surface);stroke:var(--line)}.well{fill:var(--well)}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--accent)}.gfx{fill:var(--gfx)}.soft{fill:var(--soft)}
.turn{fill:var(--surface);stroke:var(--text);stroke-width:1.5}.chip{fill:var(--well);stroke:var(--strong);stroke-width:1.2}
.read{fill:var(--gfx)}.onread{fill:var(--onink)}.ghost{fill:none;stroke:var(--strong);stroke-width:1.5;stroke-dasharray:5 4}
.ink{fill:var(--ink)}.onink{fill:var(--onink)}.ln{stroke:var(--line);stroke-width:1}.lnS{stroke:var(--strong);stroke-width:1.5;fill:none}
.lnA{stroke:var(--gfx);stroke-width:2;fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes h1{0%,4.55%{opacity:0}7.73%,89.09%{opacity:1}100%{opacity:0}}.h1{animation:h1 11.0s ease-out infinite}@keyframes h2{0%,13.24%{opacity:0}16.42%,89.09%{opacity:1}100%{opacity:0}}.h2{animation:h2 11.0s ease-out infinite}@keyframes h3{0%,19.65%{opacity:0}22.83%,89.09%{opacity:1}100%{opacity:0}}.h3{animation:h3 11.0s ease-out infinite}@keyframes h4{0%,28.34%{opacity:0}31.52%,89.09%{opacity:1}100%{opacity:0}}.h4{animation:h4 11.0s ease-out infinite}@keyframes h5{0%,34.75%{opacity:0}37.93%,89.09%{opacity:1}100%{opacity:0}}.h5{animation:h5 11.0s ease-out infinite}@keyframes h6{0%,4.55%{opacity:0}7.73%,89.09%{opacity:1}100%{opacity:0}}.h6{animation:h6 11.0s ease-out infinite}@keyframes h7{0%,13.24%{opacity:0}16.42%,89.09%{opacity:1}100%{opacity:0}}.h7{animation:h7 11.0s ease-out infinite}@keyframes h8{0%,24.35%{opacity:0}27.53%,89.09%{opacity:1}100%{opacity:0}}.h8{animation:h8 11.0s ease-out infinite}@keyframes h9{0%,36.39%{opacity:0}39.57%,89.09%{opacity:1}100%{opacity:0}}.h9{animation:h9 11.0s ease-out infinite}</style><rect class="bg" x=".5" y=".5" width="879" height="257" rx="14"/><text x="28" y="34" font-size="13" font-weight="700" class="muted">WITHOUT HOIST</text><text x="28" y="74" font-size="12" class="subtle">the agent asks,</text><text x="28" y="89" font-size="12" class="subtle">one read per turn</text><text x="28" y="176" font-size="12" class="acc" font-weight="600">Hoist reads ahead,</text><text x="28" y="191" font-size="12" class="acc" font-weight="600">in the same result</text><line class="ln" x1="24" x2="856" y1="116" y2="116"/><text x="28" y="136" font-size="13" font-weight="700" class="acc">WITH HOIST</text><g class="h1"><rect class="turn" x="176" y="54" width="118" height="44" rx="8"/><text x="235.0" y="73" text-anchor="middle" font-size="12" font-weight="600">LLM turn 1</text><text x="235.0" y="88" text-anchor="middle" font-size="11" class="subtle">asks for the user</text></g><g class="h2"><rect class="chip" x="298" y="60" width="86" height="32" rx="6"/><text class="m" x="341.0" y="81" text-anchor="middle" font-size="11">get_user</text></g><g class="h3"><rect class="turn" x="388" y="54" width="118" height="44" rx="8"/><text x="447.0" y="73" text-anchor="middle" font-size="12" font-weight="600">LLM turn 2</text><text x="447.0" y="88" text-anchor="middle" font-size="11" class="subtle">asks for the order</text></g><g class="h4"><rect class="chip" x="510" y="60" width="86" height="32" rx="6"/><text class="m" x="553.0" y="81" text-anchor="middle" font-size="11">get_order</text></g><g class="h5"><rect class="turn" x="600" y="54" width="118" height="44" rx="8"/><text x="659.0" y="73" text-anchor="middle" font-size="12" font-weight="600">LLM turn 3</text><text x="659.0" y="88" text-anchor="middle" font-size="11" class="subtle">replies</text></g><g class="h6"><rect class="turn" x="176" y="156" width="118" height="44" rx="8"/><text x="235.0" y="175" text-anchor="middle" font-size="12" font-weight="600">LLM turn 1</text><text x="235.0" y="190" text-anchor="middle" font-size="11" class="subtle">asks for the user</text></g><g class="h7"><rect class="chip" x="298" y="162" width="76.0" height="32" rx="6"/><rect class="read" x="374.0" y="162" width="76.0" height="32" rx="6"/><text class="m" x="336.0" y="183" text-anchor="middle" font-size="11">get_user</text><text class="m onread" x="412.0" y="183" text-anchor="middle" font-size="11">get_order</text></g><g class="h8"><rect class="turn" x="454" y="156" width="118" height="44" rx="8"/><text x="513.0" y="175" text-anchor="middle" font-size="12" font-weight="600">LLM turn 2</text><text x="513.0" y="190" text-anchor="middle" font-size="11" class="subtle">replies</text></g><g class="h9"><rect class="ghost" x="576" y="156" width="142" height="44" rx="8"/><text x="647.0" y="175" text-anchor="middle" font-size="12" font-weight="700" class="acc">1 LLM turn</text><text x="647.0" y="190" text-anchor="middle" font-size="11" class="acc">spared</text></g><line class="lnS" x1="176" x2="726" y1="224" y2="224"/><path class="lnS" d="M720 219l8 5-8 5"/><text x="176" y="243" font-size="11" class="subtle">time</text><text x="856" y="243" text-anchor="end" font-size="11" class="subtle">Illustrative: a lookup of the order the user names, read from the first result.</text></svg>
