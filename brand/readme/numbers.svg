<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-labelledby="t d"><title id="t">Hoist's headline results, each with its scope</title><desc id="d">Live on 28 τ²-bench retail and airline tasks, three trials, pre-registered: Claude Sonnet 5 took 20.5% fewer LLM turns and Claude Haiku 4.5 22.4% fewer. Replay of nine agents it never saw: 86.4% of retail's read-only ceiling, 10.2 points more than a next-step speculator. A procedure compiled once passes 39 of 40 held-out solo telecom tasks at 0.48 LLM turns per ticket against 15.9 for the model alone.</desc><style>
:root{--bg:#f8fbfb;--surface:#ffffff;--well:#eff3f4;--line:#dae1e3;--strong:#7e888b;--text:#141c1e;--muted:#4a5557;--subtle:#646e70;--accent:#02767b;--gfx:#039298;--soft:#e0f5f6;--ink:#141c1e;--onink:#f8fbfb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f11;--surface:#121719;--well:#191f21;--line:#272f32;--strong:#606b6f;--text:#eceff0;--muted:#b3bcbf;--subtle:#909a9d;--accent:#5dd2d8;--gfx:#33c0c7;--soft:#0b292c;--ink:#eceff0;--onink:#0b0f11}}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--surface);stroke:var(--line)}.well{fill:var(--well)}
.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.acc{fill:var(--accent)}.gfx{fill:var(--gfx)}.soft{fill:var(--soft)}
.turn{fill:var(--surface);stroke:var(--text);stroke-width:1.5}.chip{fill:var(--well);stroke:var(--strong);stroke-width:1.2}
.read{fill:var(--gfx)}.onread{fill:var(--onink)}.ghost{fill:none;stroke:var(--strong);stroke-width:1.5;stroke-dasharray:5 4}
.ink{fill:var(--ink)}.onink{fill:var(--onink)}.ln{stroke:var(--line);stroke-width:1}.lnS{stroke:var(--strong);stroke-width:1.5;fill:none}
.lnA{stroke:var(--gfx);stroke-width:2;fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes n0{0%{opacity:0}100%{opacity:1}}.n0{animation:n0 .8s ease-out 0.0s backwards}@keyframes n1{0%{opacity:0}100%{opacity:1}}.n1{animation:n1 .8s ease-out 0.2s backwards}@keyframes n2{0%{opacity:0}100%{opacity:1}}.n2{animation:n2 .8s ease-out 0.4s backwards}</style><rect class="bg" x=".5" y=".5" width="879" height="149" rx="14"/><g class="n0"><text class="acc m" x="24" y="34" font-size="11" font-weight="700">LIVE</text><text x="24" y="78" font-size="34" font-weight="700" letter-spacing="-1">20.5% · 22.4%</text><text x="24" y="98" font-size="13" class="muted">fewer LLM turns</text><text x="24" y="120" font-size="12" font-weight="600">Claude Sonnet 5 · Claude Haiku 4.5</text><text x="24" y="136" font-size="11" class="subtle">τ²-bench, 28 tasks, 3 trials, pre-registered</text></g><g class="n1"><text class="acc m" x="301" y="34" font-size="11" font-weight="700">REPLAY</text><text x="301" y="78" font-size="34" font-weight="700" letter-spacing="-1">86.4%</text><text x="301" y="98" font-size="13" class="muted">of retail’s read-only ceiling</text><text x="301" y="120" font-size="12" font-weight="600">nine agents it never saw</text><text x="301" y="136" font-size="11" class="subtle">10.2 points over a next-step speculator</text></g><line class="ln" x1="285" x2="285" y1="24" y2="134"/><g class="n2"><text class="acc m" x="578" y="34" font-size="11" font-weight="700">PROCEDURE</text><text x="578" y="78" font-size="34" font-weight="700" letter-spacing="-1">39 of 40</text><text x="578" y="98" font-size="13" class="muted">held-out tasks passed</text><text x="578" y="120" font-size="12" font-weight="600">0.48 LLM turns per ticket</text><text x="578" y="136" font-size="11" class="subtle">τ²-bench solo telecom; 15.9 for the model alone</text></g><line class="ln" x1="562" x2="562" y1="24" y2="134"/></svg>
